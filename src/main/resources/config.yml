  pack-rebuilt: "<green>Resource pack regenerado (SHA-1 <white>%sha1%</white>)."
  chat-prompt: "<gold>»</gold> <yellow>%prompt%</yellow> <gray>(escribe <white>cancelar</white> para salir)"
