# ─────────────────────────────────────────────────────────────
#  RadiantItems · configuración principal
#  Los ítems se definen en plugins/RadiantItems/items/<id>.yml
#  (uno por archivo) o en items.yml bajo la sección "items:".
# ─────────────────────────────────────────────────────────────

# Ítems: se cargan recursivamente todos los .yml de items/ y sus subcarpetas (sin límite).
items:
  # Extrae el catálogo de 100 ítems por defecto (items/<categoria>/*.yml) si items/ está vacía.
  generate-defaults: true

# Permiso por ítem ("permission:" en el YAML del ítem). Quien tenga este nodo se lo salta.
permissions:
  bypass-item-permission: radiantitems.bypass.permission

# ─────────────────────────────────────────────────────────────
#  Update checker (asíncrono, timeout 5 s, nunca bloquea el servidor)
#  Avisa en consola (y a los admins al entrar) si hay una versión
#  más nueva. Sin conexión, repo privado o sin releases → se ignora.
# ─────────────────────────────────────────────────────────────
update-checker:
  enabled: true
  # "github" (GitHub Releases) o "spigot" (SpigotMC vía api.spiget.org)
  source: "github"
  # usuario/repositorio de GitHub: se lee tag_name y html_url de releases/latest
  github-repo: "TTVPrivalo21/RadiantItems"
  # ID numérico del recurso en SpigotMC (el número al final de su URL). 0 = desactivado
  spigot-resource-id: 0
  # Mensaje clicable a los jugadores con radiantitems.admin al conectarse
  notify-admins-on-join: true

# Recarga automática: si cambias un archivo de items/ o textures/ se recarga solo.
auto-reload:
  enabled: true
  interval-seconds: 3

# Cada cuántos ticks se revisan manos/armadura (HOLD_LOOP, EQUIP, UNEQUIP).
loop:
  interval-ticks: 5
  # Cada cuántos ticks se actualizan los ítems antiguos del inventario cuando cambias su YAML.
  update-interval-ticks: 100

# Formato de los placeholders internos en lore/mensajes.
format:
  unlimited-uses: "∞"
  cooldown-ready: "<green>Listo</green>"
  cooldown: "<yellow>%time%s</yellow>"
  no-owner: "<gray>Nadie</gray>"

# Pico/acción MINE_AREA
mine-area:
  max-hardness: 50.0
  blacklist:
    - BEDROCK
    - BARRIER
    - END_PORTAL_FRAME
    - END_PORTAL
    - NETHER_PORTAL
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - STRUCTURE_BLOCK
    - JIGSAW
    - REINFORCED_DEEPSLATE
    - SPAWNER
    - TRIAL_SPAWNER
    - VAULT

# ─────────────────────────────────────────────────────────────
#  Resource pack (OPCIONAL y secundario)
#  El plugin funciona al 100 % con ítems vanilla sin ningún pack.
#  false → no se levanta el servidor HTTP, no se envía nada y el
#          campo "texture:" de los ítems se ignora.
#  true  → genera el pack desde textures/items/*.png, lo sirve por
#          HTTP y asigna item_model a los ítems con "texture:".
# ─────────────────────────────────────────────────────────────
resource-pack:
  enabled: false

# Ajustes del pack (solo se usan con resource-pack.enabled: true)
pack:
  send-on-join: true
  send-delay-ticks: 40
  required: false
  prompt: "<gold>RadiantItems</gold> <gray>usa texturas propias para sus ítems.</gray>"
  description: "<gold>RadiantItems</gold> <gray>· ítems personalizados</gray>"
  # 46 = 1.21.4. min/max cubren 1.21.4 → 26.x
  pack-format: 46
  min-format: 46
  max-format: 999
  # Asigna item_model (1.21.4+) a los ítems con "texture:". Si el jugador rechaza el pack verá el ítem sin textura.
  use-item-model: true
  # Genera assets/minecraft/items/<material>.json con range_dispatch para ítems con custom-model-data + texture.
  custom-model-data-dispatch: true
  # Si http.enabled=false, URL externa donde subes tú el zip ({sha1} se reemplaza).
  external-url: ""

http:
  enabled: true
  bind: 0.0.0.0
  port: 8166
  # URL pública que verán los jugadores, ej. "http://mc.miservidor.com:8166". Vacío = autodetectar.
  public-url: ""
  threads: 2

# ─────────────────────────────────────────────────────────────
#  Mensajes (MiniMessage o &códigos)
# ─────────────────────────────────────────────────────────────
messages:
  prefix: "<dark_gray>[<gradient:#FB923C:#F97316>RadiantItems</gradient><dark_gray>]</dark_gray> "
  no-permission: "<red>No tienes permiso para hacer eso."
  player-only: "<red>Este comando solo puede usarlo un jugador."
  unknown-item: "<red>No existe ningún ítem con id <white>%id%</white>."
  player-not-found: "<red>Jugador <white>%player%</white> no encontrado."
  invalid-number: "<red><white>%value%</white> no es un número válido."
  invalid-id: "<red>Id inválido: usa solo minúsculas, números, '_' o '-'."
  given: "<green>Diste <white>%amount%x %item%</white> a <white>%player%</white>."
  received: "<green>Recibiste <white>%amount%x %item%</white>."
  given-folder: "<#FB923C>Diste <white>%count%</white> ítems (x%amount%) de <white>%folder%</white> a <white>%player%</white>.<gray> Soltados al suelo: %dropped%"
  received-folder: "<#FB923C>Recibiste <white>%count%</white> ítems de la carpeta <white>%folder%</white>."
  unknown-folder: "<red>La carpeta <white>%folder%</white> no existe o está vacía. Carpetas: <white>%folders%"
