  setuses-unlimited: "<red>Este ítem no tiene usos limitados (max-uses: 0)."
  reloaded: "<green>RadiantItems recargado: <white>%count%</white> ítems."
  created: "<green>Ítem <white>%id%</white> creado. Abriendo el editor..."
  already-exists: "<red>Ya existe un ítem con id <white>%id%</white>."
