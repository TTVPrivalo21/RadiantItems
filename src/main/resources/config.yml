  dropped: "<#FB923C>Soltados <white>%amount%x %item%</white> en <white>%world% %x% %y% %z%</white>."
  store-blocked: "<red>Este ítem no se puede guardar en contenedores."
  pickup-blocked: "<red>Este ítem está vinculado a <white>%owner%</white>."
  update-available: "<#FB923C>⬆ Nueva versión de RadiantItems: <white>%installed%</white> <dark_gray>→</dark_gray> <#F97316><b>%latest%</b></#F97316> <dark_gray>(%source%)</dark_gray> <click:open_url:'%url%'><hover:show_text:'<#FB923C>Abrir %url%'><#F97316><u>[Descargar]</u></#F97316></hover></click>"
  list-header: "<#FB923C>Ítems cargados (<white>%count%</white>)<gray>%filter%<#FB923C>:"
  list-category: "<#F97316>▸ %category% <dark_gray>(%count%)"
  list-categories: "<gray>Categorías: <white>%categories%"
  list-entry: "  <dark_gray>• <#FB923C>%id%</#FB923C> <white>%name%</white> <dark_gray>[%material%, %activators% activadores]"
  not-custom: "<red>No sostienes un ítem de RadiantItems."
  forged-item: "<red>Este ítem tiene datos de RadiantItems con firma inválida (copiado o falsificado)."
  info: |-
    <gold>Ítem: <yellow>%id%</yellow> <gray>(%name%<gray>)
    <gray>Material: <white>%material%</white>  Usos: <white>%uses%/%max_uses%</white>
    <gray>UUID: <white>%uuid%</white>  Dueño: <white>%owner%</white>
    <gray>Variables: <white>%vars%</white>
    <gray>Activadores: <white>%activators%</white>
