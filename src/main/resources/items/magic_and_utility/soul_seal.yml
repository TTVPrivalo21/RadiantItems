# Magia · Sello del Alma: soulbound, se conserva al morir y protege a su dueño.
id: soul_seal
material: ECHO_SHARD
name: "<gradient:#FB923C:#F97316><b>Sello del Alma</b></gradient>"
lore:
  - "<white>Se vincula al primer jugador que lo usa."
  - "<white>Se conserva al morir y no se puede soltar."
  - "<white>No se puede guardar en cofres; al morir maldice a tu asesino."
  - "<#FB923C>Clic derecho</#FB923C> <dark_gray>»</dark_gray> <white>escudo de alma (60s)"
  - "<dark_gray>Dueño: %owner%"
glow: true
restrictions: { soulbound: true, keep-on-death: true, no-drop: true, no-store: true }
activators:
  ward:
    type: RIGHT_CLICK
    cooldown: 60
    actions:
      - "EFFECT: RESISTANCE 200 1"
      - "EFFECT: ABSORPTION 200 1"
      - "PARTICLE_SPIRAL: SOUL 0.8 2"
      - "SOUND: block.respawn_anchor.charge 1 1.2"
  curse:
    type: DEATH
    slot: ANY
    actions:
      - "@target EFFECT: WITHER 100 1"
      - "@target EFFECT: GLOWING 200 0"
      - "@target MESSAGE: <#F97316>El Sello del Alma de %player% te ha maldecido."
      - "PARTICLE_SPIRAL: SOUL 1 2"
