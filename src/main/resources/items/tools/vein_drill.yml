      - "VEIN_MINE: 48"
      - "VARIABLE: ores + %broken%"
      - "ACTIONBAR: <#F97316>⛏ Veta: <white>%broken% bloques"
      - "SOUND: block.amethyst_block.chime 0.8 0.8"
