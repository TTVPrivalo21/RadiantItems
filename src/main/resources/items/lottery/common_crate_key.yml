      - "LOOT: 60=GIVE_ITEM: IRON_INGOT 8 && MESSAGE: <white>Caja común: <#FB923C>8 hierro ;; 30=GIVE_ITEM: GOLD_INGOT 6 && MESSAGE: <white>Caja común: <#FB923C>6 oro ;; 10=GIVE_ITEM: DIAMOND 2 && MESSAGE: <white>Caja común: <#F97316>¡2 diamantes!"
      - "@block PARTICLE: FIREWORK 25 0.4 0.1"
      - "SOUND: block.chest.open 1 1.2"
