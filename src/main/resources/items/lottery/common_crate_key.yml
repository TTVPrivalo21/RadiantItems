# Lotería · Llave Común: úsala sobre un cofre o barril para abrir una caja (LOOT ponderado).
id: common_crate_key
material: TRIPWIRE_HOOK
name: "<gradient:#FB923C:#F97316><b>Llave de Caja Común</b></gradient>"
lore:
  - "<#FB923C>Clic derecho en un cofre</#FB923C> <dark_gray>»</dark_gray> <white>abrir caja"
