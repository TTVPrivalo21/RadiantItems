    type: RIGHT_CLICK
    cooldown: 30
    actions:
      - "EFFECT: INVISIBILITY 120 0 hide"
      - "EFFECT: SPEED 120 1 hide"
      - "PARTICLE: LARGE_SMOKE 30 0.5 0.02"
      - "SOUND: entity.illusioner.cast_spell 1 0.8"
