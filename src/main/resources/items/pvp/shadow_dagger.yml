# PvP · Daga de las Sombras: puñalada agachado e invisibilidad temporal.
id: shadow_dagger
material: IRON_SWORD
name: "<gradient:#FB923C:#F97316><b>Daga de las Sombras</b></gradient>"
lore:
  - "<white>Agachado: <#F97316>+80%</#F97316> <white>de daño."
  - "<#FB923C>Clic derecho</#FB923C> <dark_gray>»</dark_gray> <white>invisibilidad 6s (30s)"
attributes:
  - "ATTACK_DAMAGE: 5 mainhand"
  - "ATTACK_SPEED: -1 mainhand"
flags: [HIDE_ATTRIBUTES]
activators:
